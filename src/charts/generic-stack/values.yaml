# ---------------------------------------------------------------------------
# Global
# ---------------------------------------------------------------------------
global:
  imageRegistry: ghcr.io/beatos-learns/vsc-kubernetes-containers
  imagePullSecrets: []
  storageClass: ""
  # one pre-created Secret every component falls back to when its own
  # existingSecret is unset (db and backend share the db-password key)
  existingSecret: ""

nameOverride: ""
commonLabels: {}
extraObjects: []

# ---------------------------------------------------------------------------
# Monitoring: the admin and log interface every image ships, configured once
# for all components (templates/monitoring.yaml writes it to each component's
# env surface; null keeps the image default; a component's `env` wins)
# ---------------------------------------------------------------------------
monitoring:
  # health checker behind /startupz /livez /readyz and the health_* metrics
  healthCheck:
    interval: null      # seconds between checker cycles
    timeout: null       # seconds per check, must stay below the interval
    staleFactor: null   # snapshot older than factor x interval flips /livez
  # drain sequence on SIGTERM/SIGINT; the pod's terminationGracePeriodSeconds
  # is derived from it (delay + timeout + the image's escalation window + margin)
  shutdown:
    drainDelay: null    # seconds of not-ready before intake stops
    timeout: null       # seconds granted to in-flight work
    margin: 5           # seconds of grace period beyond what the image needs
  logging:
    level: info
    format: json
    # true/false switches the access log of every HTTP component; null keeps
    # each image's own default (frontend on, backend off, proxy off)
    access: null

# ---------------------------------------------------------------------------
# Component defaults (deep-merged under every component)
# ---------------------------------------------------------------------------
componentDefaults:
  enabled: true
  kind: Deployment
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    behavior: {}
  pdb:
    enabled: false
    minAvailable: null
    maxUnavailable: null
  image:
    registry: ""
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  security:
    uid: null
    gid: null
  # containerPorts are also written to the container's env (monitoring.portEnv /
  # adminPortEnv, an extra port's own `env`), so image and pod always agree
  ports:
    main:
      name: http
      containerPort: 8080
      servicePort: 8080
      protocol: TCP
    admin:
      name: admin
      containerPort: 9090
    extra: []
  env: {}
  secretEnv: {}
  existingSecret: ""
  secret: {}
  secretMount:
    enabled: false
    mountPath: /run/secrets
    # project only these keys of the Secret (empty = every key)
    keys: []
  files: {}
  filesMountPath: ""
  persistence:
    enabled: false
    mountPath: ""
    subPath: ""
    size: 1Gi
    accessModes:
      - ReadWriteOnce
    storageClass: ""
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
    exposeAdmin: false
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  # periodSeconds null = derived from the effective health checker: startup and
  # readiness probe once per checker cycle, liveness once per staleness window
  # (staleFactor x interval, the moment the image itself reports not alive)
  probes:
    startup:
      enabled: true
      path: /startupz
      periodSeconds: null
      failureThreshold: 36
      timeoutSeconds: 2
    liveness:
      enabled: true
      path: /livez
      periodSeconds: null
      failureThreshold: 3
      timeoutSeconds: 2
    readiness:
      enabled: true
      path: /readyz
      periodSeconds: null
      failureThreshold: 2
      timeoutSeconds: 2
  # the image's admin/log interface as the chart-wide `monitoring` block sees it:
  # the env names it writes to, and the image's own health-check and shutdown
  # defaults (from its CONTRACT.md) that apply while the chart-wide value is null
  monitoring:
    portEnv: PORT
    adminPortEnv: ADMIN_PORT
    portFormat: "%d"
    levelEnv: LOG_LEVEL
    formatEnv: LOG_FORMAT
    accessEnv: ACCESS_LOG
    upperCaseLevel: false
    formatValues:
      json: json
      text: text
    healthCheck:
      interval: 5
      timeout: 2
      staleFactor: 3
    shutdown:
      drainDelay: 3
      timeout: 10
      escalation: 0     # seconds the image spends escalating after the budget
  resources: {}
  # Deployment: verbatim `strategy`; unset = RollingUpdate maxUnavailable 0 /
  # maxSurge 1 (Recreate when persistence is enabled). StatefulSet: updateStrategy.
  strategy: {}
  minReadySeconds: 0
  # none | preferred | required — hostname anti-affinity among the component's
  # own pods; merged into `affinity` unless that already has a podAntiAffinity
  antiAffinity: preferred
  topologySpreadConstraints: []
  priorityClassName: ""
  # null = drainDelay + timeout + escalation + monitoring.shutdown.margin; an
  # explicit value must still cover delay + timeout + escalation
  terminationGracePeriodSeconds: null
  automountServiceAccountToken: false
  podSecurityContext: {}
  containerSecurityContext: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  command: []
  args: []
  initContainers: []
  extraVolumes: []
  extraVolumeMounts: []

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  db:
    kind: StatefulSet
    image:
      repository: postgresql
      tag: "0.0.2"
    security:
      uid: 10020
      gid: 10020
    ports:
      main:
        name: postgresql
        containerPort: 5432
        servicePort: 5432
        protocol: TCP
    env:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    secretMount:
      enabled: true
    filesMountPath: /docker-entrypoint-initdb.d
    persistence:
      enabled: true
      mountPath: /var/lib/postgresql
      size: 2Gi
    probes:
      startup:
        failureThreshold: 60
    monitoring:
      healthCheck:
        timeout: 3
      shutdown:
        drainDelay: 0
        timeout: 30
        escalation: 5

  backend:
    image:
      repository: user-mgmt-service
      tag: "0.0.3"
    security:
      uid: 10021
      gid: 10021
    ports:
      main:
        name: http
        containerPort: 8080
        servicePort: 8080
        protocol: TCP
    env:
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://{{ include "generic-stack.componentName" (dict "root" . "name" "db") }}:{{ .Values.components.db.ports.main.servicePort }}/{{ .Values.components.db.env.POSTGRES_DB }}'
      SPRING_DATASOURCE_USERNAME: '{{ .Values.components.db.env.POSTGRES_USER }}'
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_ISSUER: user-mgmt-service
      JWT_EXPIRATION_MILLIS: "3600000"
    secretEnv:
      SPRING_DATASOURCE_PASSWORD: db-password
      JWT_SECRET: jwt-secret

  frontend:
    image:
      repository: auth-portal
      tag: "0.0.2"
    security:
      uid: 10022
      gid: 10022
    ports:
      main:
        name: http
        containerPort: 3000
        servicePort: 3000
        protocol: TCP
    env:
      API_URL: 'http://{{ include "generic-stack.componentName" (dict "root" . "name" "backend") }}:{{ .Values.components.backend.ports.main.servicePort }}'

  proxy:
    image:
      repository: traefik
      tag: "0.0.3"
    security:
      uid: 10023
      gid: 10023
    ports:
      main:
        name: web
        containerPort: 8080
        servicePort: 80
        protocol: TCP
      extra:
        - name: websecure
          containerPort: 8443
          servicePort: 443
          protocol: TCP
          env: TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS
        # Traefik's own metrics endpoint: container-only, never published on
        # the LoadBalancer Service
        - name: metrics
          containerPort: 9101
          exposed: false
          env: TRAEFIK_ENTRYPOINTS_METRICS_ADDRESS
    monitoring:
      # Traefik takes its listeners as entrypoint addresses (":port")
      portEnv: TRAEFIK_ENTRYPOINTS_WEB_ADDRESS
      portFormat: ":%d"
      levelEnv: TRAEFIK_LOG_LEVEL
      formatEnv: TRAEFIK_LOG_FORMAT
      accessEnv: TRAEFIK_ACCESSLOG
      upperCaseLevel: true
      formatValues:
        json: json
        text: common
      shutdown:
        timeout: 15
    files:
      routes.yaml: |
        http:
          routers:
            app:
              rule: PathPrefix(`/`)
              entryPoints:
                - web
              service: frontend
          services:
            frontend:
              loadBalancer:
                servers:
                  - url: "http://{{ include "generic-stack.componentName" (dict "root" . "name" "frontend") }}:{{ .Values.components.frontend.ports.main.servicePort }}"
    filesMountPath: /etc/traefik/dynamic
    persistence:
      enabled: false
      mountPath: /data
    service:
      type: LoadBalancer
