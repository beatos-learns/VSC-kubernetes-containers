{{/* ------------------------------------------------------------------------ */}}
{{- range $name, $raw := .Values.components }}
{{- $spec := mustMergeOverwrite (deepCopy $.Values.componentDefaults) (deepCopy $raw) }}
{{- if $spec.enabled }}
{{- $needsSecret := or $spec.secretEnv $spec.secretMount.enabled }}
{{- if and $needsSecret (not $spec.existingSecret) }}
{{- if not $spec.secret }}
{{- fail (printf "components.%s consumes secret keys: set components.%s.existingSecret or components.%s.secret" $name $name $name) }}
{{- end }}
{{- range $envName, $key := $spec.secretEnv }}
{{- if not (hasKey $spec.secret $key) }}
{{- fail (printf "components.%s.secret is missing key %q referenced by secretEnv.%s" $name $key $envName) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "generic-stack.componentName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "generic-stack.labels" (dict "root" $ "name" $name "spec" $spec) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $spec.secret }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
